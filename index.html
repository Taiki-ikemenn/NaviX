<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="NaviX">
<meta name="theme-color" content="#1a56c4">
<meta name="description" content="NaviX（ナヴィクス）— 地図・検索・ナビ・ARが使えるWebのカーナビ">
<title>NaviX（ナヴィクス）</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>

/* ===== 色・文字 =====
   案内標識の青を軸に、規制標識の赤と警戒標識の黄を差し色にしています */
:root{
  --sign:#1a56c4;        /* 案内標識の青（ルート・案内板） */
  --sign-d:#123f93;
  --stop:#d42a22;        /* 規制標識の赤 */
  --warn:#f2c230;        /* 警戒標識の黄 */
  --ink:#1c2430;
  --muted:#667085;
  --line:#e3e6ea;
  --panel:#ffffff;
  --soft:#f2f4f7;
  --r-lg:20px; --r:14px; --r-sm:10px;
  --shadow:0 6px 24px rgba(16,24,40,.18);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#dfe3dc}
body{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI",system-ui,sans-serif;color:var(--ink);-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;border:none;background:none;cursor:pointer}
input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sign);outline-offset:2px}
[hidden]{display:none!important}

#map{position:fixed;inset:0}

/* ===== 検索 ===== */
.top{position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top) + 12px);z-index:20;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.top>*{pointer-events:auto}
.search{display:flex;align-items:center;gap:8px;background:var(--panel);border-radius:var(--r);box-shadow:var(--shadow);padding:0 6px 0 14px;height:52px}
.search .logo{width:26px;height:26px;flex:none;border-radius:7px;background:var(--sign);position:relative;box-shadow:inset 0 0 0 2px var(--sign),inset 0 0 0 3.5px #fff}
.search .logo::after{content:"";position:absolute;left:8px;top:6px;width:9px;height:13px;border-left:3px solid #fff;border-top:3px solid #fff;transform:skewY(-30deg)}
.search input{flex:1;min-width:0;border:none;outline:none;background:none;font-size:17px;height:100%;-webkit-user-select:text;user-select:text}
.search input::placeholder{color:#98a2b3}
.icon-btn{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--muted)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;background:var(--panel);border-radius:99px;padding:8px 14px;font-size:14px;font-weight:600;box-shadow:0 2px 8px rgba(16,24,40,.14);white-space:nowrap}
.chip.on{background:var(--ink);color:#fff}
.results{background:var(--panel);border-radius:var(--r);box-shadow:var(--shadow);max-height:52vh;overflow-y:auto}
.res{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:12px 14px;border-top:1px solid var(--line)}
.res:first-child{border-top:none}
.res .ic{width:36px;height:36px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:17px;color:#fff}
.res b{display:block;font-size:16px;font-weight:600}
.res small{display:block;font-size:13px;color:var(--muted);margin-top:1px}
.res .km{margin-left:auto;font-size:13px;color:var(--muted);flex:none}
.res-empty{padding:16px;color:var(--muted);font-size:14px}

/* ===== 右のボタン ===== */
.fabs{position:fixed;right:12px;bottom:calc(env(safe-area-inset-bottom) + 24px);z-index:15;display:flex;flex-direction:column;gap:10px}
.fab{width:50px;height:50px;border-radius:14px;background:var(--panel);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center}
.fab svg{width:26px;height:26px}
.fab.on{background:var(--sign);color:#fff}
.layers{position:fixed;right:72px;z-index:25;background:var(--panel);border-radius:var(--r);box-shadow:var(--shadow);padding:12px;display:flex;flex-wrap:wrap;gap:10px;width:248px}
.layer{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
.layer i{width:64px;height:64px;border-radius:12px;border:3px solid transparent;display:block}
.layer.on{color:var(--sign)} .layer.on i{border-color:var(--sign)}
.layer .t-normal{background:linear-gradient(90deg,transparent 44%,#ffd79a 44% 56%,transparent 56%),linear-gradient(0deg,transparent 46%,#fff 46% 54%,transparent 54%),#e9ece4}
.layer .t-aerial{background:radial-gradient(circle at 30% 30%,#5f7a45 0 14%,transparent 15%),radial-gradient(circle at 70% 65%,#8a7f6e 0 16%,transparent 17%),linear-gradient(90deg,transparent 45%,#4a4d50 45% 55%,transparent 55%),#6d7a52}
.layer .t-detail{background:linear-gradient(90deg,transparent 44%,#ffd79a 44% 56%,transparent 56%),repeating-linear-gradient(0deg,#d2d0c8 0 10px,#e9ece4 10px 14px)}

/* ===== シート（詳細・ルート） ===== */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--panel);border-radius:var(--r-lg) var(--r-lg) 0 0;box-shadow:0 -6px 30px rgba(16,24,40,.22);max-height:58vh;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
.sheet .grip{width:100%;padding:10px 0 4px;display:flex;justify-content:center;flex:none}
.sheet .grip::before{content:"";width:40px;height:5px;border-radius:3px;background:#d0d5dd}
.sheet-body{overflow-y:auto;padding:4px 20px 20px}
.sheet.min .sheet-body>*:not(.s-head){display:none}
@media (min-width:820px){
  .top{right:auto;width:390px}
  .sheet{left:12px;right:auto;bottom:auto;top:calc(env(safe-area-inset-top) + 76px);width:390px;max-height:calc(100vh - 100px);border-radius:var(--r-lg)}
  .sheet .grip{display:none}
  .sheet-body{padding-top:18px}
  body.sheet-open .top .chips,body.sheet-open .top .results{display:none!important}
}
.s-head{display:flex;gap:12px;align-items:flex-start}
.s-head .ic{width:46px;height:46px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:22px;color:#fff}
.s-title{font-size:21px;font-weight:700;line-height:1.35}
.s-sub{font-size:14px;color:var(--muted);margin-top:2px}
.s-close{margin-left:auto;flex:none;width:34px;height:34px;border-radius:50%;background:var(--soft);font-size:18px;color:var(--muted)}
.actions{display:flex;gap:10px;margin:16px 0 6px}
.btn{flex:1;height:48px;border-radius:12px;font-weight:700;font-size:16px;background:var(--soft);display:flex;align-items:center;justify-content:center;gap:6px}
.btn.go{background:var(--sign);color:#fff}
.btn.red{background:#fdecea;color:var(--stop)}
.rows{margin-top:12px}
.row{display:grid;grid-template-columns:28px 1fr;gap:10px;padding:12px 0;border-top:1px solid var(--line);font-size:15px;line-height:1.5}
.row .k{font-size:18px;text-align:center}
.row a{color:var(--sign);word-break:break-all}
.row small{color:var(--muted);display:block;font-size:13px}
.desc{font-size:15px;line-height:1.7;margin-top:12px;color:#344054}

/* ルートのプレビュー */
.r-sum{display:flex;align-items:baseline;gap:12px;margin-top:4px}
.r-sum .min{font-size:34px;font-weight:800;color:var(--sign);letter-spacing:-.02em}
.r-sum .km{font-size:18px;font-weight:700;color:var(--muted)}
.r-sum .eta{margin-left:auto;font-size:16px;font-weight:700;color:var(--ink);background:var(--soft);border-radius:99px;padding:4px 12px}
.r-via{font-size:14px;color:var(--muted);margin-top:2px}
.r-facts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.fact{display:flex;align-items:center;gap:6px;background:var(--soft);border-radius:99px;padding:6px 12px 6px 6px;font-size:14px;font-weight:600}
.fact .mini{width:22px;height:22px}
.steps{list-style:none;margin-top:14px}
.steps li{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line);font-size:15px}
.steps .arr{width:40px;height:40px;border-radius:10px;background:var(--sign);display:flex;align-items:center;justify-content:center}
.steps .arr svg{width:30px;height:30px}
.steps small{display:block;color:var(--muted);font-size:13px}
.steps .d{font-size:13px;color:var(--muted);font-weight:600}
details.more summary{cursor:pointer;font-weight:700;font-size:15px;margin-top:14px;color:var(--sign)}

/* ===== ナビ画面 ===== */
.guide{position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top) + 12px);z-index:20;display:flex;align-items:center;gap:14px;background:var(--sign);color:#fff;border-radius:16px;padding:14px 16px;border:3px solid #fff;box-shadow:0 0 0 3px var(--sign),var(--shadow)}
.g-arrow{width:72px;height:72px;flex:none}
.g-arrow svg{width:100%;height:100%}
.g-dist{font-size:38px;font-weight:800;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.g-dist small{font-size:20px;font-weight:700;margin-left:2px}
.g-text{font-size:20px;font-weight:700;margin-top:6px;line-height:1.3}
.g-road{font-size:15px;opacity:.85;margin-top:3px}
.then{position:fixed;left:24px;z-index:19;background:var(--sign-d);color:#fff;border-radius:0 0 12px 12px;padding:6px 14px 6px 10px;font-size:15px;font-weight:700;display:flex;align-items:center;gap:6px}
.then svg{width:26px;height:26px}
@media (min-width:820px){ .guide{right:auto;width:470px} }

.signs{position:fixed;left:12px;z-index:18;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.limit{width:66px;height:66px;border-radius:50%;background:#fff;border:7px solid var(--stop);display:flex;align-items:center;justify-content:center;font-size:27px;font-weight:800;color:#1f3c88;box-shadow:var(--shadow);font-variant-numeric:tabular-nums;letter-spacing:-.04em}
.alert{display:flex;align-items:center;gap:10px;background:var(--panel);border-radius:12px;padding:6px 12px 6px 6px;box-shadow:var(--shadow);font-weight:700;font-size:15px}
.alert .sg{width:44px;height:44px;flex:none}
.alert small{display:block;font-size:12px;color:var(--muted);font-weight:600}
.alert.now{animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.05)}}

.speedo{position:fixed;left:12px;z-index:18;background:var(--panel);border-radius:14px;box-shadow:var(--shadow);padding:8px 14px;text-align:center;min-width:82px}
.speedo b{display:block;font-size:30px;font-weight:800;line-height:1.05;font-variant-numeric:tabular-nums}
.speedo small{font-size:12px;color:var(--muted);font-weight:600}
.speedo.over b{color:var(--stop)}

.navbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--panel);border-radius:var(--r-lg) var(--r-lg) 0 0;box-shadow:0 -6px 24px rgba(16,24,40,.18);padding:14px 16px calc(env(safe-area-inset-bottom) + 14px);display:flex;align-items:center;gap:10px}
.navbar .remain b{font-size:26px;font-weight:800;color:var(--ink)}
.navbar .remain span{font-size:15px;color:var(--muted);font-weight:600;margin-left:8px}
.navbar .remain{min-width:0;flex:1}
.navbar .remain small{display:block;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.navbar .remain b,.navbar .remain span{white-space:nowrap}
.nav-btns{margin-left:auto;display:flex;gap:8px;flex:none}
.nb{height:46px;min-width:46px;padding:0 11px;border-radius:12px;background:var(--soft);font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center}
.nb svg{width:22px;height:22px}
.nb.end{background:var(--stop);color:#fff;min-width:64px;white-space:nowrap}
.nb.on{background:var(--sign);color:#fff}
@media (min-width:820px){ .navbar{left:12px;right:auto;bottom:12px;width:470px;border-radius:var(--r-lg)} }
.recenter{position:fixed;left:50%;transform:translateX(-50%);z-index:21;background:var(--panel);box-shadow:var(--shadow);border-radius:99px;padding:10px 18px;font-weight:700;font-size:15px;color:var(--sign);display:flex;gap:6px;align-items:center}

.arrive{position:fixed;inset:0;z-index:40;background:rgba(16,24,40,.45);display:flex;align-items:center;justify-content:center;padding:24px}
.arrive-card{background:var(--panel);border-radius:var(--r-lg);padding:28px 24px 20px;width:min(380px,100%);text-align:center;box-shadow:var(--shadow)}
.arrive-card .flag{width:64px;height:64px;margin:0 auto 10px;border-radius:50%;background:var(--sign);display:flex;align-items:center;justify-content:center}
.arrive-card h2{font-size:22px}
.arrive-card p{color:var(--muted);margin:6px 0 18px;font-size:15px}

.ai-btn{width:100%;height:46px;border-radius:12px;margin-top:4px;font-weight:700;font-size:15px;color:#5b21b6;background:linear-gradient(90deg,#f3e8ff,#e0ecff);display:flex;align-items:center;justify-content:center;gap:6px}
.ai-box{margin-top:12px;border-radius:14px;background:#f8f6ff;border:1px solid #e4dcff;padding:14px}
.ai-head{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;color:#5b21b6}
.ai-head small{margin-left:auto;font-weight:600;font-size:12px;color:var(--muted);background:#fff;border-radius:99px;padding:2px 8px}
.ai-body{font-size:15px;line-height:1.75;margin-top:8px;color:#26303d;-webkit-user-select:text;user-select:text}
.ai-body ul{padding-left:1.2em;margin:4px 0}
.ai-body p+p{margin-top:6px}
.ai-q{display:flex;gap:8px;margin-top:10px}
.ai-q input{flex:1;min-width:0;height:42px;border-radius:10px;border:1px solid #d9d2f5;padding:0 12px;font-size:15px;background:#fff;-webkit-user-select:text;user-select:text}
.ai-q button{height:42px;padding:0 14px;border-radius:10px;background:#6d28d9;color:#fff;font-weight:700}
.dots{display:inline-flex;gap:4px;margin-top:10px}
.dots i{width:7px;height:7px;border-radius:50%;background:#8b5cf6;animation:bl 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes bl{50%{opacity:.25}}
.form{display:flex;flex-direction:column;gap:6px;margin-top:14px}
.form label{font-size:14px;font-weight:700}
.form input{height:46px;border-radius:10px;border:1px solid var(--line);padding:0 12px;font-size:15px;background:var(--soft);-webkit-user-select:text;user-select:text}
.note{font-size:13px;color:var(--muted);line-height:1.6;margin-top:6px}
.note.warn{color:#b54708}
.tr-row{width:100%;display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding-top:10px;font-size:14px;font-weight:700}
.tr-row input{width:22px;height:22px;accent-color:var(--sign)}
.chip.fav{color:#b54708}
.chip.fav.on{background:#b54708;color:#fff}
/* 音声操作 */
.voice{position:fixed;inset:0;z-index:55;background:rgba(16,24,40,.5);display:flex;align-items:flex-end;justify-content:center}
.v-card{background:var(--panel);width:min(520px,100%);border-radius:24px 24px 0 0;padding:22px 20px calc(env(safe-area-inset-bottom) + 18px);text-align:center}
@media (min-width:820px){ .voice{align-items:center} .v-card{border-radius:24px} }
.v-mic{width:84px;height:84px;margin:0 auto;border-radius:50%;background:var(--sign);display:flex;align-items:center;justify-content:center;color:#fff;position:relative}
.v-mic svg{width:38px;height:38px}
.v-mic.on::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:4px solid var(--sign);animation:ring 1.2s infinite}
@keyframes ring{0%{transform:scale(.9);opacity:.9}100%{transform:scale(1.25);opacity:0}}
.v-state{margin-top:14px;font-weight:700;font-size:16px}
.v-text{margin-top:8px;font-size:20px;font-weight:700;min-height:30px;color:var(--ink)}
.v-reply{margin-top:6px;font-size:15px;color:var(--sign);font-weight:700;min-height:22px}
.v-form{display:flex;gap:8px;margin-top:14px}
.v-form input{flex:1;min-width:0;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--soft);padding:0 12px;font-size:15px;-webkit-user-select:text;user-select:text}
.v-form button{height:46px;padding:0 16px;border-radius:12px;background:var(--sign);color:#fff;font-weight:700}
.v-ex{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:14px}
.v-ex button{background:var(--soft);border-radius:99px;padding:6px 12px;font-size:13px;font-weight:600}
.v-close{margin-top:14px;color:var(--muted);font-weight:700;padding:8px 20px}
/* AR */
#arView{position:fixed;inset:0;z-index:5;background:#000}
#arVideo,#arCanvas{position:absolute;inset:0;width:100%;height:100%}
#arVideo{object-fit:cover}
.ar-tools{position:fixed;right:12px;z-index:19;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.ar-tools button{background:rgba(16,24,40,.72);color:#fff;border-radius:99px;padding:8px 14px;font-size:13px;font-weight:700}
.ar-tag{position:fixed;left:50%;transform:translateX(-50%);z-index:19;background:rgba(16,24,40,.6);color:#fff;font-size:12px;font-weight:600;border-radius:99px;padding:4px 10px;white-space:nowrap}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 76px);transform:translate(-50%,-10px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:99px;font-size:14px;font-weight:600;z-index:60;opacity:0;transition:.25s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
.demo-tag{position:fixed;right:12px;top:calc(env(safe-area-inset-top) + 12px);z-index:14;background:rgba(28,36,48,.72);color:#fff;font-size:12px;font-weight:600;border-radius:8px;padding:5px 9px}
@media (max-width:819px){ .demo-tag{top:auto;bottom:calc(env(safe-area-inset-bottom) + 6px);right:auto;left:12px} }
@media (prefers-reduced-motion:reduce){ .alert.now{animation:none} .toast{transition:none} }
/* ===== 実用版の追加 ===== */
.maplibregl-ctrl-bottom-left{bottom:env(safe-area-inset-bottom)}
.maplibregl-ctrl-attrib{font-size:11px}
body.nav-on .maplibregl-ctrl-bottom-left{display:none}
.me{width:44px;height:44px;z-index:2}
.me-dot{position:absolute;left:50%;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:#1a56c4;border:3px solid #fff;box-shadow:0 0 0 8px rgba(26,86,196,.18),0 2px 6px rgba(0,0,0,.3)}
.me-cone{position:absolute;left:50%;top:50%;width:0;height:0;margin-left:-16px;margin-top:-34px;border-left:16px solid transparent;border-right:16px solid transparent;border-bottom:30px solid rgba(26,86,196,.28);opacity:0}
.me.dir .me-cone{opacity:1}
.car{width:46px;height:46px;filter:drop-shadow(0 3px 4px rgba(0,0,0,.35))}
.car svg{width:100%;height:100%}
.flag{width:30px;height:40px}
.flag svg{width:100%;height:100%}
.pin{width:30px;height:40px;cursor:pointer;filter:drop-shadow(0 2px 3px rgba(0,0,0,.3))}
.pin svg{width:100%;height:100%}
.poi{width:30px;height:30px;border-radius:50%;border:2.5px solid #fff;display:flex;align-items:center;justify-content:center;font-size:15px;color:#fff;box-shadow:0 2px 6px rgba(0,0,0,.3);cursor:pointer}
.poi.big{width:38px;height:38px;font-size:19px}
.favm{width:26px;height:26px;border-radius:50%;background:#dc6803;border:2.5px solid #fff;color:#fff;font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.3);cursor:pointer}
.alts{display:flex;gap:8px;margin-top:12px}
.alt{flex:1;text-align:left;border:2px solid var(--line);border-radius:12px;padding:8px 12px}
.alt b{display:block;font-size:17px}
.alt small{font-size:12px;color:var(--muted)}
.alt.on{border-color:var(--sign);background:#eef4ff}
.gps-badge{position:fixed;right:12px;z-index:19;background:#b54708;color:#fff;font-size:13px;font-weight:700;border-radius:99px;padding:5px 12px;white-space:nowrap}
.gps-badge.sim{background:rgba(16,24,40,.75)}
.start{position:fixed;inset:0;z-index:70;background:rgba(16,24,40,.55);display:flex;align-items:center;justify-content:center;padding:24px}
.h3{font-size:16px;margin-top:20px}
.v-mic{border:none;cursor:pointer}
.res-empty .dots{margin:0 6px 0 0;vertical-align:middle}
.fact .dots{margin:0 4px 0 6px}
.sheet .s-sub{word-break:break-all}
#arView{z-index:6}
.ver{margin:14px 0 0;font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.04em}

/* 音楽 */
.music{position:fixed;right:12px;top:calc(env(safe-area-inset-top) + 76px);z-index:36;width:min(360px,calc(100vw - 24px));max-height:calc(100vh - 110px);overflow-y:auto;background:var(--panel);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:14px}
.mu-head{display:flex;align-items:center;gap:8px}
.mu-head b{font-size:16px;margin-right:auto}
.mu-head button{height:34px;padding:0 12px;border-radius:99px;background:var(--soft);font-size:13px;font-weight:700;color:var(--muted)}

.mu-player iframe,.mu-player>div{width:100%;height:100%;display:block;border:0}
.mu-title{margin-top:8px;font-size:15px;font-weight:700;line-height:1.4;min-height:21px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.mu-ctrl{display:flex;gap:10px;justify-content:center;margin-top:8px}

.mu-form{display:flex;gap:8px;margin-top:12px}
.mu-form input{flex:1;min-width:0;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--soft);padding:0 12px;font-size:15px;-webkit-user-select:text;user-select:text}
.mu-form button{height:44px;padding:0 14px;border-radius:10px;background:var(--sign);color:#fff;font-weight:700}
.mu-list{margin-top:8px}
.mu-item{display:flex;gap:10px;align-items:center;width:100%;text-align:left;padding:8px 2px;border-top:1px solid var(--line)}
.mu-item img,.mu-item .ph{width:64px;height:36px;border-radius:6px;object-fit:cover;flex:none;background:#e4e7ec;display:flex;align-items:center;justify-content:center;font-size:16px}
.mu-item b{display:block;font-size:14px;font-weight:600;line-height:1.35;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.mu-item small{display:block;font-size:12px;color:var(--muted)}
.mu-item .del{margin-left:auto;flex:none;width:30px;height:30px;border-radius:50%;color:var(--muted)}
.mu-sec{font-size:13px;font-weight:700;color:var(--muted);margin-top:12px}
.music.mini{width:236px;padding:10px;z-index:17}
@media (max-width:819px){ body:not(.nav-on) .music.mini{top:auto;bottom:calc(env(safe-area-inset-bottom) + 24px);right:76px} }
.music.mini .mu-yt,.music.mini .mu-form,.music.mini .mu-list,.music.mini .mu-sec,.music.mini .note{display:none}
.music.mini .mu-player{min-height:200px;aspect-ratio:auto;height:200px}

body.nav-on .toast{top:auto;bottom:calc(env(safe-area-inset-bottom) + 140px)}

</style>

<body>
<div id="map" aria-label="地図"></div>

<!-- 検索 -->
<div class="top" id="top">
  <form class="search" id="searchForm" role="search">
    <span class="logo" aria-hidden="true"></span>
    <input id="q" type="search" placeholder="場所・住所をさがす" autocomplete="off" enterkeyhint="search" aria-label="場所・住所をさがす">
    <button class="icon-btn" id="qClear" type="button" hidden aria-label="入力を消す">✕</button>
    <button class="icon-btn" id="micBtn" type="button" aria-label="音声で操作"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
    <button class="icon-btn" id="setBtn" type="button" aria-label="設定"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg></button>
  </form>
  <div class="chips" id="chips"></div>
  <div class="results" id="results" hidden></div>
</div>

<!-- 右のボタン -->
<div class="fabs" id="fabs">
  <button class="fab" id="musicBtn" aria-label="音楽"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg></button>
  <button class="fab" id="micBtn2" hidden aria-label="音声で操作"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
  <button class="fab" id="layerBtn" aria-label="地図の表示を切り替える"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3 2 8l10 5 10-5-10-5Z"/><path d="m2 13 10 5 10-5"/></svg></button>
  <button class="fab" id="compassBtn" aria-label="北を上にする"><svg viewBox="0 0 24 24" id="compassSvg"><path d="M12 2 16 12H8Z" fill="#d42a22"/><path d="M12 22 8 12h8Z" fill="#98a2b3"/></svg></button>
  <button class="fab" id="pinBtn" aria-label="地図の中心にピンを立てる"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-6-5.4-6-10.5a6 6 0 0 1 12 0C18 15.6 12 21 12 21Z"/><path d="M12 8v5M9.5 10.5h5"/></svg></button>
  <button class="fab" id="locBtn" aria-label="現在地を表示"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4" fill="currentColor"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></button>
</div>
<div class="layers" id="layers" hidden role="menu" aria-label="地図の表示">
  <button class="layer" data-m="normal" role="menuitemradio"><i class="t-normal"></i>通常</button>
  <button class="layer" data-m="aerial" role="menuitemradio"><i class="t-aerial"></i>航空写真</button>
  <button class="layer" data-m="detail" role="menuitemradio"><i class="t-detail"></i>詳細</button>
  <label class="tr-row"><span>🏢 立体の建物（通常）</span><input type="checkbox" id="bldChk" checked></label>
</div>

<!-- 詳細・ルートのシート -->
<section class="sheet" id="sheet" hidden aria-live="polite">
  <button class="grip" id="grip" aria-label="シートを小さくする"></button>
  <div class="sheet-body" id="sheetBody"></div>
</section>

<!-- ナビ -->
<div id="navUI" hidden>
  <div class="guide" id="guide" role="status">
    <div class="g-arrow" id="gArrow"></div>
    <div>
      <div class="g-dist" id="gDist"></div>
      <div class="g-text" id="gText"></div>
      <div class="g-road" id="gRoad"></div>
    </div>
  </div>
  <div class="then" id="gThen" hidden></div>
  <div class="signs" id="signs"><div class="limit" id="limit" hidden>40</div><div id="alerts" style="display:flex;flex-direction:column;gap:8px"></div></div>
  <div class="speedo" id="speedo"><b id="spd">0</b><small>km/h</small></div>
  <div class="gps-badge" id="gpsBadge" hidden></div>
  <button class="recenter" id="recenter" hidden><svg width="18" height="18" viewBox="0 0 24 24"><path d="M12 3 19 20 12 16 5 20Z" fill="currentColor"/></svg>現在地に戻る</button>
  <div class="navbar">
    <div class="remain"><b id="rTime">—</b><span id="rDist"></span><small id="rNote"></small></div>
    <div class="nav-btns">
      <button class="nb" id="arBtn" aria-label="AR表示">AR</button>
      <button class="nb" id="overBtn" aria-label="ルート全体を表示"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
      <button class="nb" id="speedBtn" hidden aria-label="デモ走行の速さ">×1</button>
      <button class="nb end" id="endBtn">終了</button>
    </div>
  </div>
</div>

<div id="arView" hidden>
  <video id="arVideo" playsinline muted autoplay></video>
  <canvas id="arCanvas"></canvas>
</div>
<div class="ar-tools" id="arTools" hidden><button id="arSrc">📷 カメラを使う</button></div>
<span class="ar-tag" id="arTag" hidden></span>

<div class="voice" id="voice" hidden role="dialog" aria-label="音声操作">
  <div class="v-card">
    <button class="v-mic" id="vMic" aria-label="もう一度聞く"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
    <p class="v-state" id="vState">お話しください</p>
    <p class="v-text" id="vText"></p>
    <p class="v-reply" id="vReply" role="status"></p>
    <form class="v-form" id="vForm"><input id="vInput" placeholder="文字でも入力できます" autocomplete="off" enterkeyhint="send" aria-label="コマンドを入力"><button>実行</button></form>
    <div class="v-ex" id="vEx"></div>
    <button class="v-close" id="vClose">閉じる</button>
  </div>
</div>

<section class="music" id="music" hidden aria-label="音楽">
  <div class="mu-head"><b>🎵 音楽<span class="mu-yt">（YouTube）</span></b><button id="muMin">小さく</button><button id="muClose" aria-label="音楽を閉じる">✕</button></div>
  <div class="mu-player"><div id="ytPlayer"></div></div>
  <div class="mu-title" id="muTitle">曲を選んでください</div>
  <div class="mu-ctrl"><button id="muPrev" aria-label="前の曲">⏮</button><button id="muPlay" aria-label="再生・一時停止">▶</button><button id="muNext" aria-label="次の曲">⏭</button></div>
  <form class="mu-form" id="muForm"><input id="muIn" placeholder="YouTubeのURL、または曲名" autocomplete="off" enterkeyhint="search" aria-label="YouTubeのURLまたは曲名"><button>再生</button></form>
  <div class="mu-list" id="muList"></div>
  <p class="note" id="muNote"></p>
</section>

<div class="arrive" id="arrive" hidden>
  <div class="arrive-card">
    <div class="flag"><svg width="34" height="34" viewBox="0 0 24 24" fill="#fff"><path d="M5 21V4h11l-1.5 3.5L16 11H7v10Z"/></svg></div>
    <h2>目的地に到着しました</h2>
    <p id="arriveText"></p>
    <button class="btn go" id="arriveOk" style="width:100%">案内を終了</button>
  </div>
</div>

<div class="start" id="start" hidden>
  <div class="arrive-card">
    <div class="flag"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 19 20 12 16 5 20Z"/></svg></div>
    <h2>現在地を使いますか？</h2>
    <p id="startText">NaviXは、現在地を使って地図・検索・ナビを動かします。</p>
    <button class="btn go" id="startOk" style="width:100%">現在地を使う</button>
    <button class="btn" id="startSkip" style="width:100%;margin-top:8px">今回は使わない</button>
    <p class="ver" id="verStart"></p>
  </div>
</div>
<span class="ver-tag" id="verTag"></span>
<div class="toast" id="toast" role="status"></div>

<script>
'use strict';
const APP_VERSION='2.1.0';
/* =====================================================================
   NaviX（ナヴィクス）
   地図: OpenFreeMap（OpenStreetMap）/ 地理院タイル
   検索: Nominatim（OpenStreetMap）/ 国土地理院 地名検索
   周辺: Overpass API（OpenStreetMap）
   経路: OSRM
   ===================================================================== */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const STORE = {
  get(k,d){ try{ const v=localStorage.getItem('navix_'+k); return v==null?d:JSON.parse(v); }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem('navix_'+k, JSON.stringify(v)); }catch(e){} },
};
const FALLBACK = {lat:35.6812, lon:139.7671};   // 位置情報がないとき（東京駅）
const API = {
  osrm: 'https://router.project-osrm.org/route/v1/driving/',
  nominatim: 'https://nominatim.openstreetmap.org/',
  gsi: 'https://msearch.gsi.go.jp/address-search/AddressSearch?q=',
  overpass: ['https://overpass-api.de/api/interpreter','https://overpass.kumi.systems/api/interpreter'],
};

/* ---------- 共通 ---------- */
function toast(t,ms=2000){ const el=$('toast'); el.textContent=t; el.classList.add('on'); clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove('on'),ms); }
async function getJSON(url, opt={}, ms=15000){
  const ctrl=new AbortController(), timer=setTimeout(()=>ctrl.abort(),ms);
  try{
    const res=await fetch(url,{...opt,signal:ctrl.signal});
    if(!res.ok){ let m=''; try{ const j=await res.json(); m=j.message||j.error||''; }catch(e){} throw new Error('HTTP '+res.status+(m?'：'+m:'')); }
    return await res.json();
  }catch(e){ if(e.name==='AbortError') throw new Error('時間切れ'); throw e; }
  finally{ clearTimeout(timer); }
}
const RE=6371008.8, rad=d=>d*Math.PI/180, deg=r=>r*180/Math.PI;
function distM(a,b){ const dLat=rad(b.lat-a.lat), dLon=rad(b.lon-a.lon); const h=Math.sin(dLat/2)**2+Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(dLon/2)**2; return 2*RE*Math.asin(Math.min(1,Math.sqrt(h))); }
function bearingDeg(a,b){ const p1=rad(a.lat),p2=rad(b.lat),dl=rad(b.lon-a.lon); return (deg(Math.atan2(Math.sin(dl)*Math.cos(p2),Math.cos(p1)*Math.sin(p2)-Math.sin(p1)*Math.cos(p2)*Math.cos(dl)))+360)%360; }
const toXY=(o,p)=>({x:rad(p.lon-o.lon)*RE*Math.cos(rad(o.lat)), y:-rad(p.lat-o.lat)*RE});
const fromXY=(o,x,y)=>({lat:o.lat-deg(y/RE), lon:o.lon+deg(x/(RE*Math.cos(rad(o.lat))))});
const angDiff=(a,b)=>((b-a+540)%360)-180;
function projSeg(p,a,b){ const dx=b.x-a.x, dy=b.y-a.y, l2=dx*dx+dy*dy||1; let t=((p.x-a.x)*dx+(p.y-a.y)*dy)/l2; t=Math.max(0,Math.min(1,t)); const x=a.x+dx*t, y=a.y+dy*t; return {t,x,y,d:Math.hypot(p.x-x,p.y-y)}; }
function fmtDist(m){
  if(m>=1000) return {n:(m/1000).toFixed(m>=10000?0:1),u:'km'};
  if(m>=100) return {n:String(Math.round(m/50)*50),u:'m'};
  return {n:String(Math.max(0,Math.round(m/10)*10)),u:'m'};
}
const distText=m=>{ const f=fmtDist(m); return f.n+f.u; };
function fmtMin(sec){ const m=Math.max(1,Math.round(sec/60)); return m>=60?`${Math.floor(m/60)}時間${m%60?m%60+'分':''}`:`${m}分`; }
const clock=sec=>{ const d=new Date(Date.now()+sec*1000); return `${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}`; };
const toHira=s=>String(s).replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60)).toLowerCase();

/* ---------- 種類（OSMのタグ → 表示） ---------- */
const KINDS={
  convenience:{label:'コンビニ',icon:'🏪',color:'#0e9384'}, supermarket:{label:'スーパー',icon:'🛒',color:'#0e9384'},
  fuel:{label:'ガソリンスタンド',icon:'⛽',color:'#ca8504'}, parking:{label:'駐車場',icon:'🅿️',color:'#1570ef'},
  cafe:{label:'カフェ',icon:'☕',color:'#93370d'}, restaurant:{label:'レストラン',icon:'🍽️',color:'#e04f16'},
  fast_food:{label:'ファストフード',icon:'🍔',color:'#e04f16'}, hospital:{label:'病院',icon:'🏥',color:'#d92d20'},
  clinic:{label:'クリニック',icon:'🏥',color:'#d92d20'}, park:{label:'公園',icon:'🌳',color:'#079455'},
  toilets:{label:'トイレ',icon:'🚻',color:'#475467'}, station:{label:'駅',icon:'🚉',color:'#475467'},
  school:{label:'学校',icon:'🏫',color:'#b54708'}, bank:{label:'銀行',icon:'🏦',color:'#475467'},
  pharmacy:{label:'薬局',icon:'💊',color:'#079455'}, post_office:{label:'郵便局',icon:'〒',color:'#d92d20'},
  police:{label:'警察',icon:'👮',color:'#1849a9'}, hotel:{label:'ホテル',icon:'🏨',color:'#6938ef'},
  address:{label:'住所・地名',icon:'📍',color:'#667085'}, place:{label:'場所',icon:'📍',color:'#667085'},
  pin:{label:'ピン',icon:'📍',color:'#d42a22'}, fav:{label:'保存した場所',icon:'★',color:'#dc6803'},
  charging_station:{label:'充電スタンド',icon:'🔌',color:'#079455'}, car_wash:{label:'洗車',icon:'🧽',color:'#1570ef'},
};
function kindOf(tags={},cls,type){
  const k=tags.shop==='convenience'?'convenience':tags.shop==='supermarket'?'supermarket':tags.amenity||tags.leisure||tags.railway||tags.shop||type||cls;
  return KINDS[k]?k:(KINDS[type]?type:'place');
}
const CHIPS=[
  ['fav','★ 保存済み',null],
  ['conv','🏪 コンビニ','nwr["shop"="convenience"]'],
  ['gas','⛽ ガソリン','nwr["amenity"="fuel"]'],
  ['parking','🅿️ 駐車場','nwr["amenity"="parking"]'],
  ['toilet','🚻 トイレ','nwr["amenity"="toilets"]'],
  ['cafe','☕ カフェ','nwr["amenity"="cafe"]'],
  ['food','🍽️ ごはん','nwr["amenity"~"^(restaurant|fast_food)$"]'],
  ['hospital','🏥 病院','nwr["amenity"~"^(hospital|clinic)$"]'],
  ['ev','🔌 充電','nwr["amenity"="charging_station"]'],
];

/* =====================================================================
   地図
   ===================================================================== */
const GSI_ATTR='<a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank" rel="noreferrer">地理院タイル</a>';
const rasterStyle=(url,maxzoom)=>({version:8,glyphs:'https://tiles.openfreemap.org/fonts/{fontstack}/{range}.pbf',
  sources:{base:{type:'raster',tiles:[url],tileSize:256,maxzoom,attribution:GSI_ATTR}},layers:[{id:'base',type:'raster',source:'base'}]});
const STYLES={
  normal:()=>'https://tiles.openfreemap.org/styles/liberty',
  aerial:()=>rasterStyle('https://cyberjapandata.gsi.go.jp/xyz/seamlessphoto/{z}/{x}/{y}.jpg',18),
  detail:()=>rasterStyle('https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png',18),
};
let mapMode=STORE.get('mode','normal'); if(!STYLES[mapMode]) mapMode='normal';
let show3D=STORE.get('bld3d',true);
const last=STORE.get('last',null);
const map=new maplibregl.Map({
  container:'map', style:STYLES[mapMode](),
  center:last?[last.lon,last.lat]:[FALLBACK.lon,FALLBACK.lat], zoom:last?15:13,
  attributionControl:false, maxPitch:65, dragRotate:true, touchPitch:true,
});
map.addControl(new maplibregl.AttributionControl({compact:true,customAttribution:'経路 <a href="https://project-osrm.org/" target="_blank" rel="noreferrer">OSRM</a>・検索 Nominatim／国土地理院・<a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noreferrer">© OpenStreetMap</a>'}),'bottom-left');
map.touchZoomRotate.enableRotation();

const EMPTY={type:'FeatureCollection',features:[]};
const srcData={route:EMPTY,alt:EMPTY,passed:EMPTY,arrow:EMPTY,arrowhead:EMPTY};
function setSrc(id,data){ srcData[id]=data; const s=map.getSource(id); if(s) s.setData(data); }
function addOverlays(){
  Object.keys(srcData).forEach(id=>{ if(!map.getSource(id)) map.addSource(id,{type:'geojson',data:srcData[id]}); });
  const W=(a,b)=>['interpolate',['linear'],['zoom'],10,a,18,b];
  const L=(id,src,paint)=>{ if(!map.getLayer(id)) map.addLayer({id,type:'line',source:src,layout:{'line-cap':'round','line-join':'round'},paint}); };
  L('alt-c','alt',{'line-color':'#667085','line-width':W(6,14),'line-opacity':.5});
  L('alt-l','alt',{'line-color':'#a8b3c4','line-width':W(4,10)});

/* =====================================================================
   現在地（GPS）
   ===================================================================== */
let me=null, watchId=null, gpsOK=false;
function startGPS(){
  if(!('geolocation' in navigator)){ toast('この端末では位置情報を使えません'); return; }
  if(watchId!=null) return;
  watchId=navigator.geolocation.watchPosition(pos=>{
    const c=pos.coords;
    const p={lat:c.latitude,lon:c.longitude,acc:c.accuracy,speed:c.speed,heading:(c.heading!=null&&!isNaN(c.heading))?c.heading:null,t:pos.timestamp};
    const first=!gpsOK; gpsOK=true;
    onPosition(p,false);
    if(first && !nav.on){ map.jumpTo({center:[p.lon,p.lat],zoom:16}); }
  },err=>{
    if(err.code===1) toast('位置情報が許可されていません。設定から許可してください',3500);
    else toast('現在地を取得できません');
    gpsBadge();
  },{enableHighAccuracy:true,maximumAge:1000,timeout:20000});
}
function onPosition(p,simulated){
  if(nav.on && nav.sim && !simulated) { me={...p}; return; }   // デモ走行中は本物のGPSで動かさない
  if(me && p.heading==null){ const d=distM(me,p); if(d>3) p.heading=bearingDeg(me,p); else p.heading=me.heading; }
  if(me && p.speed==null){ const dt=(p.t-me.t)/1000; p.speed=dt>0?distM(me,p)/dt:0; }
  me=p;
  STORE.set('last',{lat:p.lat,lon:p.lon});
  if(!nav.on){ meMarker.setLngLat([p.lon,p.lat]).addTo(map); meMarker.setRotation(p.heading||0); meEl.classList.toggle('dir',p.heading!=null); }
  if(nav.on) navOnPosition(p);
  gpsBadge();
}
function gpsBadge(){
  const b=$('gpsBadge'); if(!nav.on) return;
  if(nav.sim){ b.hidden=true; return; }
  if(!me){ b.hidden=false; b.textContent='GPSをさがしています…'; b.className='gps-badge'; return; }
  b.hidden = me.acc<40; b.textContent=`GPSの精度が低いです（±${Math.round(me.acc)}m）`; b.className='gps-badge';
}
const here=()=>me||{lat:map.getCenter().lat,lon:map.getCenter().lng};

  if(!me){ startGPS(); toast('現在地をさがしています…'); return; }

});

function jaAddress(a={}){
  const parts=[a.province||a.state, a.city||a.town||a.village||a.county, a.city_district, a.suburb, a.quarter, a.neighbourhood, a.road, a.house_number];
  const out=[]; parts.forEach(x=>{ if(x && !out.includes(x)) out.push(x); }); return out.join('');
}
function fromNominatim(r){
  const tags=r.extratags||{}, name=(r.namedetails&&(r.namedetails['name:ja']||r.namedetails.name))||r.name||(r.display_name||'').split(',')[0];
  const kind=kindOf({...tags,[r.category||r.class]:r.type},r.category||r.class,r.type);
  return {name, lat:+r.lat, lon:+r.lon, address:jaAddress(r.address), tags, kind, osm:r.osm_type&&r.osm_id?`${r.osm_type}/${r.osm_id}`:null, src:'OpenStreetMap'};
}
async function searchNominatim(q,near){
  const vb=near?`&viewbox=${near.lon-0.25},${near.lat+0.2},${near.lon+0.25},${near.lat-0.2}`:'';
  const j=await getJSON(`${API.nominatim}search?format=jsonv2&addressdetails=1&extratags=1&namedetails=1&accept-language=ja&countrycodes=jp&limit=12${vb}&q=${encodeURIComponent(q)}`);
  return j.map(fromNominatim);
}
async function searchGSI(q){
  const j=await getJSON(API.gsi+encodeURIComponent(q));
  return (j||[]).slice(0,10).map(f=>({name:f.properties.title, lat:f.geometry.coordinates[1], lon:f.geometry.coordinates[0], address:f.properties.title, kind:'address', tags:{}, src:'国土地理院'}));
}
async function reverse(p){
  try{
    const j=await getJSON(`${API.nominatim}reverse?format=jsonv2&addressdetails=1&accept-language=ja&zoom=18&lat=${p.lat}&lon=${p.lon}`,{},10000);
    return {address:jaAddress(j.address), road:j.address&&j.address.road};
  }catch(e){ return null; }
}
let shown=[], searchSeq=0;
async function doSearch(q){
  q=q.trim(); if(!q) return;
  const seq=++searchSeq, near=here();
  showResults(null,'さがしています…');
  const favHits=favs.filter(f=>toHira(f.name).includes(toHira(q))).map(f=>({...f,kind:'fav'}));
  const [a,b]=await Promise.allSettled([searchNominatim(q,near),searchGSI(q)]);
  if(seq!==searchSeq) return;
  let list=[...favHits];
  const looksAddr=/[0-9０-９]|丁目|番地|[都道府県市区町村]$|[市区町村]/.test(q);
  const nom=a.status==='fulfilled'?a.value:[], gsi=b.status==='fulfilled'?b.value:[];
  (looksAddr?[...gsi,...nom]:[...nom,...gsi]).forEach(p=>{ if(!list.some(x=>distM(x,p)<40 && (x.name===p.name||p.kind==='address'))) list.push(p); });
  const hq=toHira(q), score=x=>x.kind==='fav'?0:toHira(x.name).includes(hq)?1:x.kind==='address'?(looksAddr?1:3):2;
  list.sort((x,y)=>score(x)-score(y) || (looksAddr?0:distM(near,x)-distM(near,y)));
  list=list.slice(0,20);
  if(!list.length){ showResults([], a.status==='rejected'&&b.status==='rejected' ? '検索サービスにつながりませんでした。インターネット接続を確認してください。' : '見つかりませんでした。別のことばで検索してください。'); return []; }
  showResults(list);
  showResultMarkers(list);
  return list;
}
function showResultMarkers(list){

}

}

// 周辺検索（Overpass）
async function overpass(q){
  let err;
  for(const url of API.overpass){
    try{ return await getJSON(url,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'data='+encodeURIComponent(q)},20000); }
    catch(e){ err=e; }
  }
  throw err;
}
async function nearbySearch(chipKey,center,radius=1500){
  const c=CHIPS.find(x=>x[0]===chipKey); if(!c||!c[2]) return [];
  const j=await overpass(`[out:json][timeout:20];(${c[2]}(around:${radius},${center.lat},${center.lon}););out center tags 80;`);
  return (j.elements||[]).map(e=>{
    const t=e.tags||{}, lat=e.lat??(e.center&&e.center.lat), lon=e.lon??(e.center&&e.center.lon);
    const kind=kindOf(t);
    return {name:t['name:ja']||t.name||t.brand||KINDS[kind].label, lat, lon, tags:t, kind, address:osmAddr(t), osm:`${e.type}/${e.id}`, src:'OpenStreetMap'};
  }).filter(p=>p.lat!=null).sort((a,b)=>distM(center,a)-distM(center,b)).slice(0,30);
}
function osmAddr(t){ return [t['addr:province'],t['addr:city'],t['addr:quarter']||t['addr:suburb'],t['addr:neighbourhood'],t['addr:block_number'],t['addr:housenumber']].filter(Boolean).join(''); }

  setChip(k); closeSheet();
  if(k==='fav'){ const list=favs.map(f=>({...f,kind:'fav'})); showResults(list,'まだ保存した場所はありません。場所を開いて「☆ 保存」を押すと、ここに出ます。'); showResultMarkers(list); return; }
  const center=me||here();
  showResults(null,'近くをさがしています…');

}

let state='browse', routes=[], route=null, routeDest=null;
const DIRS={'right':'右','left':'左','slight right':'斜め右','slight left':'斜め左','sharp right':'大きく右','sharp left':'大きく左','uturn':'Uターン','straight':'直進'};
function manDir(m){ return DIRS[m.modifier]||''; }
async function fetchRoutes(from,to,bearing){
  const b=bearing!=null?`&bearings=${Math.round(bearing)},60;`:'';
  const url=`${API.osrm}${from.lon},${from.lat};${to.lon},${to.lat}?overview=full&geometries=geojson&steps=true&annotations=nodes,duration,distance&alternatives=${bearing!=null?'false':'2'}${b}`;
  const j=await getJSON(url,{},20000);
  if(j.code!=='Ok'||!j.routes||!j.routes.length) throw new Error(j.message||'経路が見つかりませんでした');
  return j.routes.map(r=>buildModel(r,to));
}
function buildModel(r,to){
  const coords=r.geometry.coordinates.map(c=>({lon:c[0],lat:c[1]}));
  const o=coords[0];
  const pts=coords.map(c=>({...c,...toXY(o,c)}));
  const s=[0]; for(let i=1;i<pts.length;i++) s.push(s[i-1]+Math.hypot(pts[i].x-pts[i-1].x,pts[i].y-pts[i-1].y));
  const total=s[s.length-1];
  const dur=[], nodes=[];
  r.legs.forEach(l=>{ const a=l.annotation||{}; (a.duration||[]).forEach(v=>dur.push(v)); (a.nodes||[]).forEach(v=>{ if(nodes[nodes.length-1]!==v) nodes.push(v); }); });
  const speed=new Array(Math.max(0,pts.length-1)).fill(null);   // 制限速度はあとでOpenStreetMapから読む
  if(dur.length!==pts.length-1){ dur.length=0; for(let i=1;i<pts.length;i++) dur.push((s[i]-s[i-1])/total*r.duration); }
  const durRest=new Array(pts.length).fill(0); for(let i=pts.length-2;i>=0;i--) durRest[i]=durRest[i+1]+dur[i];
  const locate=(c,from)=>{ const p=toXY(o,c); let best={d:1e9,s:0,i:from}; for(let i=Math.max(0,from);i<pts.length-1;i++){ const q=projSeg(p,pts[i],pts[i+1]); if(q.d<best.d){ best={d:q.d,s:s[i]+q.t*(s[i+1]-s[i]),i}; } if(best.d<1 && i>best.i+50) break; } return best; };
  const man=[], inters=[], names=new Map();
  let idx=0;
  const steps=r.legs.flatMap(l=>l.steps);
  steps.forEach((st,k)=>{
    const ml={lon:st.maneuver.location[0],lat:st.maneuver.location[1]};
    const L=locate(ml,idx); idx=L.i;
    (st.intersections||[]).forEach((it,n)=>{ if(k===0&&n===0) return; if((it.bearings||[]).length>=3){ const li=locate({lon:it.location[0],lat:it.location[1]},Math.max(0,idx-2)); inters.push({s:li.s,lat:it.location[1],lon:it.location[0]}); } });
    if(st.name) names.set(st.name,(names.get(st.name)||0)+st.distance);
    const type=st.maneuver.type, mod=st.maneuver.modifier;
    const delta=angDiff(st.maneuver.bearing_before||0,st.maneuver.bearing_after||0);
    const skip = type==='depart' || type==='new name' || type==='notification' || ((type==='continue'||type==='turn') && (mod==='straight'||!mod));
    if(!skip || type==='arrive') man.push({s:type==='arrive'?total:L.s,type,modifier:mod,delta:type==='arrive'?0:delta,name:st.name||'',ref:st.ref||'',exit:st.maneuver.exit,lat:ml.lat,lon:ml.lon,dest:st.destinations||''});
  });
  inters.sort((a,b)=>a.s-b.s);
  if(!man.length || man[man.length-1].type!=='arrive') man.push({s:total,type:'arrive',delta:0,name:'',lat:to.lat,lon:to.lon});
  // 目的地が道路の左右どちらか
  const last=pts[pts.length-1], prev=pts[Math.max(0,pts.length-2)], tx=toXY(o,to);
  const cross=(last.x-prev.x)*(tx.y-last.y)-(last.y-prev.y)*(tx.x-last.x);
  man[man.length-1].side=Math.hypot(tx.x-last.x,tx.y-last.y)<5?'':cross>0?'右':'左';
  const via=[...names.entries()].sort((a,b)=>b[1]-a[1]).slice(0,2).map(x=>x[0]);
  return {o,pts,s,total,time:r.duration,speed,nodes,dur,durRest,man,inters,via,to,feats:null,geo:{type:'Feature',geometry:r.geometry,properties:{}}};
}
// 経路上の信号・一時停止・踏切（OpenStreetMap）
async function loadRouteFeatures(r){
  if(r.total>40000){ r.feats={sigs:[],stops:[],rails:[],partial:true}; return r.feats; }
  let mnLat=90,mxLat=-90,mnLon=180,mxLon=-180; r.pts.forEach(p=>{ mnLat=Math.min(mnLat,p.lat); mxLat=Math.max(mxLat,p.lat); mnLon=Math.min(mnLon,p.lon); mxLon=Math.max(mxLon,p.lon); });
  const pad=0.0008, bb=`${mnLat-pad},${mnLon-pad},${mxLat+pad},${mxLon+pad}`;
  const j=await overpass(`[out:json][timeout:25];(node["highway"~"^(traffic_signals|stop)$"](${bb});node["railway"="level_crossing"](${bb});node["highway"="crossing"]["crossing"="traffic_signals"](${bb}););out;`);
  const sigs=[], stops=[], rails=[];
  const near=(lat,lon)=>{ const p=toXY(r.o,{lat,lon}); let best={d:1e9,s:0}; for(let i=0;i<r.pts.length-1;i++){ const q=projSeg(p,r.pts[i],r.pts[i+1]); if(q.d<best.d) best={d:q.d,s:r.s[i]+q.t*(r.s[i+1]-r.s[i])}; } return best; };
  (j.elements||[]).forEach(n=>{
    const t=n.tags||{}, b=near(n.lat,n.lon);
    if(t.railway==='level_crossing'){ if(b.d<4) rails.push({s:b.s,lat:n.lat,lon:n.lon}); }
    else if(t.highway==='stop'){ if(b.d<2.5 && b.s>5) stops.push({s:b.s,lat:n.lat,lon:n.lon}); }
    else if(b.d<14){ sigs.push({s:b.s,name:t.name||t['name:ja']||'',lat:n.lat,lon:n.lon}); }
  });
  const dedupe=(a,g)=>a.sort((x,y)=>x.s-y.s).filter((x,i,arr)=>i===0||x.s-arr[i-1].s>g);
  r.feats={sigs:dedupe(sigs,30),stops:dedupe(stops,15),rails:dedupe(rails,20)};
  loadSpeedLimits(r).catch(()=>{});
  // 交差点名（信号の名前）を曲がる場所につける
  r.man.forEach(m=>{ const g=r.feats.sigs.find(x=>Math.abs(x.s-m.s)<30&&x.name); if(g) m.signal=g.name; else if(r.feats.sigs.some(x=>Math.abs(x.s-m.s)<30)) m.signal=true; });
  return r.feats;
}
// 制限速度（OpenStreetMapの maxspeed）
function parseSpeed(v){ if(!v) return null; const n=parseInt(String(v).replace(/[^0-9]/g,''),10); if(!n||n>130) return null; return /mph/.test(v)?Math.round(n*1.609):n; }
async function loadSpeedLimits(r){
  const ids=[...new Set(r.nodes||[])]; if(ids.length<2||ids.length>3000) return;
  const j=await overpass(`[out:json][timeout:25];node(id:${ids.join(',')});way(bn)["highway"]["maxspeed"];out body;`);
  const pair=new Map();
  (j.elements||[]).forEach(w=>{ const v=parseSpeed(w.tags&&(w.tags.maxspeed||w.tags['maxspeed:forward']));
    if(!v||!w.nodes) return; for(let i=0;i<w.nodes.length-1;i++){ pair.set(w.nodes[i]+'-'+w.nodes[i+1],v); pair.set(w.nodes[i+1]+'-'+w.nodes[i],v); } });
  if(!pair.size) return;
  // 経路の点とOSMのノードは同じ順番で並んでいる
  const n=Math.min(r.nodes.length,r.pts.length);
  for(let i=0;i<n-1;i++){ const v=pair.get(r.nodes[i]+'-'+r.nodes[i+1]); if(v) r.speed[i]=v; }
}
function manText(r,m,from){
  if(m.type==='arrive') return m.side?`目的地です（${m.side}側）`:'目的地です';
  const dir=manDir(m);
  if(m.type==='roundabout'||m.type==='rotary') return `ロータリーを${m.exit?m.exit+'番目の出口へ':'出る'}`;
  if(m.type==='on ramp') return `${dir?dir+'方向、':''}${m.ref||m.name||'高速道路'}の入口へ`;
  if(m.type==='off ramp') return `${dir?dir+'方向、':''}出口へ`;
  if(m.type==='fork') return `分かれ道を${dir.replace('斜め','')||'道なり'}へ`;
  if(m.type==='merge') return `${dir.replace('斜め','')}から合流`;
  if(m.type==='end of road') return `突き当たりを${dir}`;
  if(m.modifier==='uturn') return 'Uターンです';
  const k = from==null ? 0 : r.inters.filter(x=>x.s>from+10 && x.s<=m.s+3).length;
  if(k>=2 && k<=4 && m.s-from<800) return `${k}つ目の交差点を${dir}`;
  if(typeof m.signal==='string') return `「${m.signal}」を${dir}`;
  if(m.signal) return `信号を${dir}`;
  return `${dir}方向です`;
}
const roadText=m=>m.type==='arrive'?'':[m.name,m.ref&&m.ref!==m.name?`（${m.ref}）`:''].join('')||(m.dest?m.dest+' 方面':'');
function arrowSVG(m,color='#fff'){

  if(m.modifier==='uturn') return `<svg viewBox="0 0 100 100"><path d="M64 92V40a16 16 0 0 0-32 0v26" fill="none" stroke="${color}" stroke-width="12" stroke-linecap="round"/><path d="M18 62h28L32 84Z" fill="${color}"/></svg>`;
  const a=Math.max(-135,Math.min(135,m.delta||0))*Math.PI/180;
  const ex=50+30*Math.sin(a), ey=50-30*Math.cos(a), tx=ex+16*Math.sin(a), ty=ey-16*Math.cos(a), bx=Math.cos(a)*14, by=Math.sin(a)*14;
  return `<svg viewBox="0 0 100 100"><path d="M50 94V54L${ex.toFixed(1)} ${ey.toFixed(1)}" fill="none" stroke="${color}" stroke-width="12" stroke-linejoin="round" stroke-linecap="round"/><path d="M${tx.toFixed(1)} ${ty.toFixed(1)}L${(ex+bx).toFixed(1)} ${(ey+by).toFixed(1)}L${(ex-bx).toFixed(1)} ${(ey-by).toFixed(1)}Z" fill="${color}" stroke="${color}" stroke-width="4" stroke-linejoin="round"/></svg>`;
}

async function startPreview(dest){
  if(!dest) return;
  const from=me;
  if(!from){ toast('現在地がわかりません。位置情報を許可してください'); startGPS(); return; }
  routeDest=dest; state='preview';
  $('results').hidden=true; clearMarkers(resultMarkers); setChip(null);
  openSheet(`<div class="s-head"><div><h2 class="s-title">${esc(dest.name||'目的地')}</h2><p class="s-sub">現在地から</p></div><button class="s-close" data-act="cancel" aria-label="経路を閉じる">✕</button></div><p class="res-empty" style="padding:16px 0"><span class="dots"><i></i><i></i><i></i></span> 経路をさがしています…</p>`);
  try{
    routes=await fetchRoutes(from,dest);
    if(state!=='preview'||routeDest!==dest) return;
    selectAlt(0,true);
    destMarker.setLngLat([dest.lon,dest.lat]).addTo(map);
    const b=new maplibregl.LngLatBounds(); routes.forEach(r=>r.pts.forEach(p=>b.extend([p.lon,p.lat])));
    map.fitBounds(b,{padding:fitPad(),bearing:0,pitch:0,duration:700});
  }catch(e){
    if(state!=='preview') return;
    $('sheetBody').querySelector('.res-empty').textContent='経路を出せませんでした：'+e.message+(navigator.onLine===false?'（インターネットにつながっていません）':'（少し待ってから、もう一度試してください）');
  }
}
function selectAlt(i,first){
  route=routes[i];
  setSrc('route',{type:'FeatureCollection',features:[route.geo]});
  setSrc('alt',{type:'FeatureCollection',features:routes.filter(r=>r!==route).map(r=>r.geo)});
  setSrc('passed',EMPTY); setSrc('arrow',EMPTY); setSrc('arrowhead',EMPTY);
  renderPreview();
  if(!route.feats){ const r=route; loadRouteFeatures(r).then(()=>{ if(route===r&&state==='preview') renderPreview(); }).catch(()=>{ r.feats={sigs:[],stops:[],rails:[],failed:true}; if(route===r&&state==='preview') renderPreview(); }); }
}
function renderPreview(){
  const r=route, d=routeDest;
  const steps=[]; let prev=0;
  r.man.forEach(m=>{ steps.push(`<li><span class="arr">${arrowSVG(m)}</span><span>${esc(m.type==='arrive'?manText(r,m):manText(r,m,prev))}<small>${esc(m.type==='arrive'?(d.name||''):roadText(m)?roadText(m)+' へ':'')}</small></span><span class="d">${distText(m.s-prev)}</span></li>`); prev=m.s; });
  const f=r.feats;
  const facts=!f?'<span class="fact"><span class="dots"><i></i><i></i><i></i></span>信号・標識を調べています</span>':f.failed?'<span class="fact">信号・標識の情報を取得できませんでした</span>':f.partial?'<span class="fact">長い経路のため、信号・標識は表示しません</span>':
    [f.sigs.length?`<span class="fact">${mini(SIGN.signal)}信号 ${f.sigs.length}か所</span>`:'',f.stops.length?`<span class="fact">${mini(SIGN.stop)}一時停止 ${f.stops.length}か所</span>`:'',f.rails.length?`<span class="fact">${mini(SIGN.rail)}踏切 ${f.rails.length}か所</span>`:''].join('')||'<span class="fact">登録された信号・一時停止はありません</span>';
  const alts=routes.length>1?`<div class="alts">${routes.map((x,i)=>`<button class="alt${x===r?' on':''}" data-act="alt" data-i="${i}"><b>${fmtMin(x.time)}</b><small>${distText(x.total)}・${esc(x.via[0]||'')}</small></button>`).join('')}</div>`:'';
  openSheet(`<div class="s-head"><div><h2 class="s-title">${esc(d.name||'目的地')}</h2><p class="s-sub">現在地から</p></div><button class="s-close" data-act="cancel" aria-label="経路を閉じる">✕</button></div>
    <div class="r-sum"><span class="min">${fmtMin(r.time)}</span><span class="km">${distText(r.total)}</span><span class="eta">${clock(r.time)} 到着</span></div>
    <p class="r-via">${r.via.length?esc(r.via.join('・'))+' 経由':''}</p>
    ${alts}
    <div class="r-facts">${facts}</div>
    <div class="actions"><button class="btn go" data-act="nav">ナビ開始</button></div>
    <button class="btn" style="width:100%" data-act="sim">デモ走行で確かめる</button>
    <details class="more"><summary>曲がる場所（${r.man.length-1}か所）</summary><ol class="steps">${steps.join('')}</ol></details>`);
}

// 位置 → ルート上の位置
function snapToRoute(r,p,from){
  const q=toXY(r.o,p); let best={d:1e9,s:0,i:from};
  const a=Math.max(0,from-3), b=Math.min(r.pts.length-1,from+400);
  for(let i=a;i<b;i++){ const t=projSeg(q,r.pts[i],r.pts[i+1]); if(t.d<best.d) best={d:t.d,s:r.s[i]+t.t*(r.s[i+1]-r.s[i]),i}; }
  if(best.d>60){ for(let i=0;i<r.pts.length-1;i++){ const t=projSeg(q,r.pts[i],r.pts[i+1]); if(t.d<best.d) best={d:t.d,s:r.s[i]+t.t*(r.s[i+1]-r.s[i]),i}; } }
  return best;
}
function routeAt(r,d){
  d=Math.max(0,Math.min(r.total,d));
  let lo=0, hi=r.s.length-1; while(hi-lo>1){ const m=(lo+hi)>>1; if(r.s[m]<=d) lo=m; else hi=m; }
  const a=r.pts[lo], b=r.pts[hi], t=(d-r.s[lo])/((r.s[hi]-r.s[lo])||1);
  return {lat:a.lat+(b.lat-a.lat)*t, lon:a.lon+(b.lon-a.lon)*t, x:a.x+(b.x-a.x)*t, y:a.y+(b.y-a.y)*t, h:bearingDeg(a,b), i:lo};
}
function routeSlice(r,d0,d1){
  d0=Math.max(0,d0); d1=Math.min(r.total,d1); if(d1<=d0) return [];
  const a=routeAt(r,d0), out=[[a.lon,a.lat]];
  for(let i=a.i+1;i<r.s.length&&r.s[i]<d1;i++) out.push([r.pts[i].lon,r.pts[i].lat]);
  const b=routeAt(r,d1); out.push([b.lon,b.lat]); return out;
}
function navOnPosition(p){
  const r=route; if(!r||nav.arrived) return;
  const sn=snapToRoute(r,p,nav.idx);
  if(!nav.sim && sn.d>40 && (p.acc==null||p.acc<60)){ nav.off++; if(nav.off>=3) reroute(p); }
  else nav.off=0;
  nav.idx=sn.i; nav.s=sn.s;
  const ra=routeAt(r,nav.s);
  nav.heading = (p.heading!=null && (p.speed||0)>2) ? p.heading : ra.h;
  nav.speed = p.speed||0;
  const pos = nav.sim||sn.d<25 ? ra : p;     // 道路の上に表示
  carMarker.setLngLat([pos.lon,pos.lat]).setRotation(nav.heading);
  if(nav.follow) map.easeTo({center:[pos.lon,pos.lat],bearing:nav.heading,zoom:camZoom(),pitch:AR.on?0:50,duration:nav.sim?140:950,easing:t=>t,padding:navPad()});
  // 通った部分
  setSrc('passed',{type:'Feature',geometry:{type:'LineString',coordinates:routeSlice(r,0,nav.s).length>1?routeSlice(r,0,nav.s):[[pos.lon,pos.lat],[pos.lon,pos.lat]]},properties:{}});
  drawManArrow();
  updateNavUI();
  if(r.total-nav.s<20 || distM(p,r.to)<20) onArrive();
}
function camZoom(){ const m=nextMan(), d=m?m.s-nav.s:1e9; const v=nav.speed*3.6; return d<150?17.6: v>70?15.6: v>40?16.4:17; }
function nextMan(){ return route&&route.man.find(m=>m.s>nav.s+2); }
function drawManArrow(){
  const r=route, m=nextMan();
  if(!m||m.type==='arrive'||m.s-nav.s>700){ setSrc('arrow',EMPTY); setSrc('arrowhead',EMPTY); return; }
  const seg=routeSlice(r,m.s-28,m.s+22); if(seg.length<2) return;
  setSrc('arrow',{type:'Feature',geometry:{type:'LineString',coordinates:seg},properties:{}});
  const b=seg[seg.length-1], a=seg[seg.length-2], h=bearingDeg({lon:a[0],lat:a[1]},{lon:b[0],lat:b[1]});
  const o={lon:b[0],lat:b[1]}, hr=rad(h), L=7, Wd=6;
  const tip=fromXY(o,Math.sin(hr)*L,-Math.cos(hr)*L), l=fromXY(o,Math.cos(hr)*Wd,Math.sin(hr)*Wd), rr=fromXY(o,-Math.cos(hr)*Wd,-Math.sin(hr)*Wd);
  setSrc('arrowhead',{type:'Feature',geometry:{type:'Polygon',coordinates:[[[tip.lon,tip.lat],[l.lon,l.lat],[rr.lon,rr.lat],[tip.lon,tip.lat]]]},properties:{}});
}
let rerouting=false;
async function reroute(p){
  if(rerouting||Date.now()-nav.lastReroute<12000) return;
  rerouting=true; nav.lastReroute=Date.now(); toast('ルートを外れました。新しいルートをさがしています…',3000);
  try{
    const rs=await fetchRoutes(p,route.to,nav.heading);
    if(!nav.on) return;
    route=rs[0]; nav.idx=0; nav.s=0; nav.off=0;
    setSrc('route',{type:'FeatureCollection',features:[route.geo]});
    loadRouteFeatures(route).catch(()=>{ route.feats={sigs:[],stops:[],rails:[],failed:true}; });
    toast('新しいルートで案内します');
  }catch(e){ toast('新しいルートを出せませんでした'); }
  finally{ rerouting=false; }
}
let lastKey='';
function updateNavUI(){
  const r=route, m=nextMan(); if(!m) return;
  const d=m.s-nav.s, f=fmtDist(d), txt=manText(r,m,nav.s);
  const key=f.n+f.u+txt+m.s;
  if(key!==lastKey){
    lastKey=key;
    $('gArrow').innerHTML=arrowSVG(m);
    $('gDist').innerHTML=`${f.n}<small>${f.u}</small>`;
    $('gText').textContent=txt;
    $('gRoad').textContent=m.type==='arrive'?(r.to.name||''):(roadText(m)?roadText(m)+' へ':'');
    const nx=r.man[r.man.indexOf(m)+1], th=$('gThen');
    if(nx && nx.s-m.s<180 && d<600){ th.hidden=false; th.innerHTML=`その先 ${arrowSVG(nx)} ${nx.type==='arrive'?'目的地':manDir(nx)||manText(r,nx)}`; } else th.hidden=true;
    layoutNav();
  }
  // 制限速度
  const lim=r.speed[routeAt(r,nav.s).i];
  const L=$('limit'); if(lim){ L.hidden=false; if(L.textContent!=String(lim)) L.textContent=lim; } else L.hidden=true;
  const kmh=Math.round(nav.speed*3.6); $('spd').textContent=kmh; $('speedo').classList.toggle('over',!!lim&&kmh>lim+5);
  // 標識
  const al=[], fe=r.feats;
  if(fe){
    const st=fe.stops.find(x=>x.s>nav.s-3), rl=fe.rails.find(x=>x.s>nav.s-3), sg=fe.sigs.find(x=>x.s>nav.s-3);
    if(st&&st.s-nav.s<250){ const dd=st.s-nav.s; al.push(`<div class="alert${dd<40?' now':''}">${SIGN.stop}<span>一時停止<small>${dd<5?'止まってください':distText(dd)+' 先'}</small></span></div>`); }
    if(rl&&rl.s-nav.s<300){ const dd=rl.s-nav.s; al.push(`<div class="alert${dd<50?' now':''}">${SIGN.rail}<span>踏切<small>${dd<5?'一時停止・左右を確認':distText(dd)+' 先・手前で一時停止'}</small></span></div>`); }
    if(sg&&sg.s-nav.s<250) al.push(`<div class="alert">${SIGN.signal}<span>信号${sg.name?'「'+esc(sg.name)+'」':''}<small>${distText(Math.max(0,sg.s-nav.s))} 先</small></span></div>`);
  }
  const html=al.join(''); if($('alerts').innerHTML!==html) $('alerts').innerHTML=html;
  // 残り
  const i=routeAt(r,nav.s).i, segFrac=(nav.s-r.s[i])/((r.s[i+1]-r.s[i])||1);
  const remain=Math.max(0,r.durRest[i]-segFrac*(r.dur[i]||0));
  nav.remain=remain;
  $('rTime').textContent=fmtMin(remain); $('rDist').textContent=distText(r.total-nav.s);
  $('rNote').textContent=`${nav.sim?'デモ走行・':''}${clock(remain)} 到着予定・${r.to.name||'目的地'}`;
}
function onArrive(){
  if(nav.arrived) return; nav.arrived=true; simStop();
  const m=route.man[route.man.length-1];
  $('arriveText').textContent=`${route.to.name||'目的地'}${m.side?`（${m.side}側）`:''}に着きました。`;
  $('arrive').hidden=false; if(navigator.vibrate) navigator.vibrate([200,100,200]);

// デモ走行（実際のルートの上を走らせて確かめる）
let simTimer=null;
function simStart(){
  simStop(); nav.simV=0;
  let lastT=performance.now();
  simTimer=setInterval(()=>{
    const now=performance.now(), dt=Math.min(.3,(now-lastT)/1000)*nav.k; lastT=now;
    const r=route; if(!r||nav.arrived) return;
    const i=routeAt(r,nav.s).i, lim=(r.speed[i]||(r.dur[i]>0?Math.min(60,(r.s[i+1]-r.s[i])/r.dur[i]*3.6):40))/3.6;
    let target=lim*.95; const DEC=2.2;
    const cap=(d,v)=>{ target=Math.min(target,Math.sqrt(v*v+2*DEC*Math.max(0,d))); };
    r.man.forEach(m=>{ const d=m.s-nav.s; if(d<-2||d>220) return; m.type==='arrive'?cap(d,0):cap(d-2,Math.abs(m.delta)>60?4.5:8); });
    if(r.feats){ [...r.feats.stops.map(x=>({s:x.s-3,w:1.8})),...r.feats.rails.map(x=>({s:x.s-10,w:2.5}))].forEach(st=>{ const k=Math.round(st.s); if(nav.simDone.has(k)) return; const d=st.s-nav.s; if(d<-1){ nav.simDone.add(k); return; } if(d<200){ cap(d,0); if(d<1&&nav.simV<.4){ nav.simWait+=dt; if(nav.simWait>st.w){ nav.simDone.add(k); nav.simWait=0; } } } }); }
    nav.simV=Math.max(0,nav.simV+Math.max(-DEC*1.6*dt,Math.min(1.8*dt,target-nav.simV)));
    const s=Math.min(r.total,nav.s+nav.simV*dt);
    const a=routeAt(r,s);
    onPosition({lat:a.lat,lon:a.lon,acc:5,speed:nav.simV,heading:a.h,t:Date.now()},true);
    if(r.total-s<1) onArrive();
  },100);
}
function simStop(){ clearInterval(simTimer); simTimer=null; }
$('speedBtn').addEventListener('click',()=>{ nav.k=nav.k>=8?1:nav.k*2; $('speedBtn').textContent='×'+nav.k; toast(`デモ走行の速さ ×${nav.k}`); });

/* =====================================================================
   AR（カメラ映像に矢印を重ねる）
   ===================================================================== */
const AR={on:false,stream:null,o:null,absSeen:false};
const arCv=$('arCanvas'), actx=arCv.getContext('2d');
let DPR=Math.min(2,devicePixelRatio||1);
function arResize(){ DPR=Math.min(2,devicePixelRatio||1); arCv.width=Math.round(innerWidth*DPR); arCv.height=Math.round(innerHeight*DPR); }
// 端末の向き（カメラがどちらを向いているか）
function onOrient(e){
  if(e.beta==null) return;
  let a=null;
  if(e.webkitCompassHeading!=null && e.webkitCompassHeading>=0) a=(360-e.webkitCompassHeading)%360;   // iPhone・iPad
  else if(e.type==='deviceorientationabsolute' || e.absolute) a=e.alpha;                              // Android
  if(e.type==='deviceorientationabsolute') AR.absSeen=true;
  else if(AR.absSeen && a==null) return;
  AR.o={a,b:e.beta,g:e.gamma||0,t:Date.now()};
}
const V3={dot:(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2], rotZ:(v,t)=>[v[0]*Math.cos(t)-v[1]*Math.sin(t),v[0]*Math.sin(t)+v[1]*Math.cos(t),v[2]]};
// カメラの向き（東・北・上の座標で、前・右・上のベクトル）
function camBasis(){
  const o=AR.o;
  if(nav.sim || !o || Date.now()-o.t>3000){
    const h=rad(nav.heading), p=rad(8);
    return {f:[Math.sin(h)*Math.cos(p),Math.cos(h)*Math.cos(p),-Math.sin(p)], r:[Math.cos(h),-Math.sin(h),0], u:[Math.sin(h)*Math.sin(p),Math.cos(h)*Math.sin(p),Math.cos(p)], src:nav.sim?'sim':'route'};
  }
  const al=rad(o.a!=null?o.a:0), be=rad(o.b), ga=rad(o.g);

    openMusic();
    const q=mq?mq[1].replace(/^(音楽|曲|BGM|なにか|何か)$/i,''):'';
    if(!q){ if(MU.ready&&!MU.playing&&MU.cur){ MU.yt.playVideo(); return {ok:1,msg:'音楽を再生します'}; } if(MU.list[0]){ playItem(MU.list[0]); return {ok:1,msg:`「${MU.list[0].title||'最近の曲'}」を再生します`}; } return {ok:1,keep:1,msg:'YouTubeのURLを貼るか、曲名を言ってください'}; }
    return await musicQuery(q);
  }
  // 行き先
  const m=s.match(/^(.+?)(?:に|まで|へ)(?:行きたい|いきたい|行って|いって|行く|いく|案内|あんない|ナビ|連れて|つれて|向かって|むかって|帰りたい|かえりたい|帰る|かえる)/);
  const q=(m?m[1]:s).replace(/^(ここから)?(一番|いちばん)?(近く|ちかく|最寄り|最寄|近い|ちかい)の?/,'').replace(/(を|が|は)?(探して|さがして|検索|見せて|みせて|教えて|おしえて|表示して|どこ)$/,'');
  if(!q) return {ok:0,msg:'うまくわかりませんでした'};
  const vc=VCHIP.find(([re])=>re.test(q));
  if(vc && q.length<=8){
    const from=me||here();
    let list; try{ list=await nearbySearch(vc[1],from); }catch(e){ return {ok:0,msg:'周辺検索のサービスにつながりませんでした'}; }
    if(!list.length) return {ok:0,msg:'近く（1.5km以内）には見つかりませんでした'};
    if(m){ if(nv) endNav(); startPreview(list[0]); return {ok:1,keep:1,msg:`いちばん近い「${list[0].name}」（${distText(distM(from,list[0]))}）への経路です。「ナビ開始」で出発します`}; }
    if(nv) return {ok:0,msg:`いちばん近いのは「${list[0].name}」（${distText(distM(from,list[0]))}）です`};
    setChip(vc[1]); showResults(list); showResultMarkers(list); closeSheet();
    return {ok:1,msg:`近くの${CHIPS.find(c=>c[0]===vc[1])[1].replace(/^\S+\s/,'')}を表示しました`};
  }
  const fav=favs.find(f=>toHira(f.name)===toHira(q));
  if(fav && m){ if(nv) endNav(); startPreview({...fav,kind:'fav'}); return {ok:1,keep:1,msg:`「${fav.name}」への経路です`}; }
  // 決まった言い方ではないとき：AIに意味を考えてもらう
  if(!m && !fromAI && AI.key){ const r=await aiCommand(t); if(r) return r; }
  if(nv && !m) return {ok:0,msg:'案内中は「到着時刻は？」「ARにして」「案内を終了」などが使えます'};
  $('q').value=q; $('qClear').hidden=false;
  const list=await doSearch(q);
  if(!list||!list.length) return {ok:0,msg:`「${q}」が見つかりませんでした`};
  if(m){ if(nv) endNav(); startPreview(list[0]); return {ok:1,keep:1,msg:`「${list[0].name}」への経路です。「ナビ開始」で出発します`}; }
  return {ok:1,msg:`「${q}」の検索結果です`};
}


/* =====================================================================
   音楽（YouTube IFrame Player API ／ YouTube Data API）
   ===================================================================== */
const MU={key:STORE.get('ytkey',''), yt:null, ready:false, queue:null, playing:false, list:STORE.get('music',[]), results:[], cur:null};
function parseYT(t){
  t=String(t||'').trim(); if(!t) return null;
  let u=null; try{ u=new URL(t.startsWith('http')?t:'https://'+t); }catch(e){}
  if(u && /youtu\.?be/.test(u.hostname)){
    const list=u.searchParams.get('list');
    let v=u.searchParams.get('v');
    if(!v){ const m=u.pathname.match(/\/(?:shorts|embed|live)\/([\w-]{11})/)||(/youtu\.be$/.test(u.hostname)&&u.pathname.match(/^\/([\w-]{11})/)); if(m) v=m[1]; }
    if(list && !/^RD/.test(list)) return {type:'list',id:list,v};
    if(v) return {type:'video',id:v};
  }
  if(/^[\w-]{11}$/.test(t)) return {type:'video',id:t};
  if(/^(PL|OLAK|UU|FL)[\w-]{10,}$/.test(t)) return {type:'list',id:t};
  return null;
}
function loadYT(){
  if(window.YT && YT.Player){ makePlayer(); return; }
  if($('ytApi')) return;
  const sc=document.createElement('script'); sc.id='ytApi'; sc.src='https://www.youtube.com/iframe_api';
  sc.onerror=()=>{ $('muNote').textContent='YouTubeを読み込めませんでした。インターネット接続を確認してください。'; };
  document.head.appendChild(sc);
}
window.onYouTubeIframeAPIReady=()=>makePlayer();
function makePlayer(){
  if(MU.yt) return;
  MU.yt=new YT.Player('ytPlayer',{width:'100%',height:'100%',playerVars:{playsinline:1,rel:0,modestbranding:1},
    events:{
      onReady:()=>{ MU.ready=true; if(MU.queue){ const q=MU.queue; MU.queue=null; playItem(q); } },
      onStateChange:e=>{
        MU.playing = e.data===YT.PlayerState.PLAYING;
        $('muPlay').textContent=MU.playing?'⏸':'▶';
        $('musicBtn').classList.toggle('playing',MU.playing);
        if(MU.playing){ const d=MU.yt.getVideoData&&MU.yt.getVideoData(); if(d&&d.title){ $('muTitle').textContent=d.title; saveRecent({type:'video',id:d.video_id,title:d.title,ch:d.author}); } }
      },
      onError:e=>{ const msg={2:'URLがまちがっているようです',5:'この動画は再生できません',100:'動画が見つかりません（削除・非公開）',101:'この動画はほかのサイトでの再生が許可されていません',150:'この動画はほかのサイトでの再生が許可されていません'}[e.data]||'再生できませんでした'; toast(msg,3000); $('muTitle').textContent=msg; if(MU.cur&&MU.cur.type==='list') setTimeout(()=>MU.yt.nextVideo(),1500); }
    }});
}
function playItem(it){
  if(!it) return;
  MU.cur=it;
  if(!MU.ready){ MU.queue=it; loadYT(); $('muTitle').textContent='読み込んでいます…'; return; }
  if(it.type==='list') MU.yt.loadPlaylist({list:it.id,listType:'playlist',index:0});
  else MU.yt.loadVideoById(it.id);
  $('muTitle').textContent=it.title||'読み込んでいます…';
  if(it.type==='list') saveRecent({...it,title:it.title||'プレイリスト'});
}
function saveRecent(it){
  if(!it||!it.id) return;
  MU.list=[it,...MU.list.filter(x=>!(x.id===it.id&&x.type===it.type))].slice(0,30);
  STORE.set('music',MU.list); renderMusic();
}
function muItem(it,k,src){
  const img=it.type==='video'?`<img src="https://i.ytimg.com/vi/${encodeURIComponent(it.id)}/default.jpg" alt="" loading="lazy">`:'<span class="ph">📃</span>';
  return `<div class="mu-item" role="button" tabindex="0" data-src="${src}" data-k="${k}">${img}<span style="min-width:0"><b>${esc(it.title||it.id)}</b><small>${esc(it.ch||(it.type==='list'?'プレイリスト':'YouTube'))}</small></span>${src==='recent'?`<button class="del" data-del="${k}" aria-label="履歴から消す">✕</button>`:''}</div>`;
}
function renderMusic(){
  const res=MU.results.length?`<div class="mu-sec">検索結果</div>${MU.results.map((x,k)=>muItem(x,k,'res')).join('')}`:'';
  const rec=MU.list.length?`<div class="mu-sec">最近再生した曲</div>${MU.list.map((x,k)=>muItem(x,k,'recent')).join('')}`:'';
  $('muList').innerHTML=res+rec;
  $('muNote').innerHTML=(MU.key?'曲名で検索できます。':'YouTubeのURLを貼ると再生できます。曲名で検索するには、⚙️設定で YouTube Data API のキーを入れてください。')+'<br>YouTubeのルールにより、再生中はプレイヤーを表示したままにします。画面を消すと止まります。運転中は操作しないでください。';
}
async function ytSearch(q){
  const j=await getJSON(`https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&videoEmbeddable=true&maxResults=10&regionCode=JP&relevanceLanguage=ja&q=${encodeURIComponent(q)}&key=${encodeURIComponent(MU.key)}`);
  return (j.items||[]).filter(x=>x.id&&x.id.videoId).map(x=>({type:'video',id:x.id.videoId,title:decodeEnt(x.snippet.title),ch:decodeEnt(x.snippet.channelTitle)}));
}
function decodeEnt(t){ const d=document.createElement('textarea'); d.innerHTML=t||''; return d.value; }
async function musicQuery(q){
  const it=parseYT(q);
  if(it){ playItem(it); return {ok:1,msg:'再生します'}; }
  if(!MU.key) return {ok:0,msg:'曲名で探すには、⚙️設定でYouTube Data APIのキーを入れてください（URLならそのまま再生できます）'};
  $('muTitle').textContent='さがしています…';
  try{
    MU.results=await ytSearch(q); renderMusic();
    if(!MU.results.length){ $('muTitle').textContent='見つかりませんでした'; return {ok:0,msg:'見つかりませんでした'}; }
    playItem(MU.results[0]); return {ok:1,msg:`「${MU.results[0].title}」を再生します`};
  }catch(e){ $('muTitle').textContent='検索できませんでした：'+e.message; return {ok:0,msg:'検索できませんでした：'+e.message}; }
}
function placeMusic(){ const m=$('music'); if(!nav.on){ m.style.bottom=''; return; } const f=$('fabs').getBoundingClientRect(); m.style.bottom=(innerHeight-f.top+10)+'px'; }
function openMusic(){ $('music').hidden=false; $('layers').hidden=true; loadYT(); renderMusic(); if(nav.on){ $('music').classList.add('mini'); $('muMin').textContent='大きく'; } placeMusic(); }
function muToggle(){ if(!MU.ready){ if(MU.list[0]) playItem(MU.list[0]); return; } MU.playing?MU.yt.pauseVideo():MU.yt.playVideo(); }
$('musicBtn').addEventListener('click',()=>{ $('music').hidden?openMusic():($('music').hidden=true); });
$('muClose').addEventListener('click',()=>{ if(MU.ready&&MU.playing) MU.yt.pauseVideo(); $('music').hidden=true; });
$('muMin').addEventListener('click',()=>{ const m=$('music').classList.toggle('mini'); $('muMin').textContent=m?'大きく':'小さく'; });
$('muPlay').addEventListener('click',muToggle);
$('muNext').addEventListener('click',()=>{ if(!MU.ready) return; MU.cur&&MU.cur.type==='list'?MU.yt.nextVideo():(MU.results.length?playItem(MU.results[(MU.results.findIndex(x=>x.id===(MU.cur&&MU.cur.id))+1)%MU.results.length]):toast('プレイリストを再生すると、次の曲に進めます')); });
$('muPrev').addEventListener('click',()=>{ if(!MU.ready) return; MU.cur&&MU.cur.type==='list'?MU.yt.previousVideo():MU.yt.seekTo(0,true); });
$('muForm').addEventListener('submit',async e=>{ e.preventDefault(); const v=$('muIn').value.trim(); if(!v) return; $('muIn').blur(); const r=await musicQuery(v); if(!r.ok) toast(r.msg,3500); else $('muIn').value=''; });
$('muList').addEventListener('click',e=>{
  const d=e.target.closest('[data-del]'); if(d){ e.stopPropagation(); MU.list.splice(+d.dataset.del,1); STORE.set('music',MU.list); renderMusic(); return; }
  const it=e.target.closest('.mu-item'); if(!it) return;
  playItem((it.dataset.src==='res'?MU.results:MU.list)[+it.dataset.k]);
});
renderMusic();

/* ---------- AIで話しかけた内容を理解する（Gemini） ---------- */
async function aiCommand(t){
  $('vState').textContent='AIが考えています…';
  const ctx={状態:state==='nav'?'ナビで案内中':state==='preview'?'経路を表示中':'地図を見ている',
    目的地:route&&route.to?route.to.name:null, 開いている場所:current?current.name:null,
    地図の表示:mapMode, 音楽:MU.playing?'再生中':'停止中', 保存した場所:favs.slice(0,10).map(f=>f.name)};
  const prompt=`あなたはカーナビアプリ「NaviX」の音声操作の係です。ユーザーの発話を、次のJSONのどれか1つに変換してください。JSONだけを返してください。
{"action":"go","query":"行き先の名前や住所"}  … ある場所に行きたい・案内してほしい
{"action":"nearby","category":"conv|gas|parking|toilet|cafe|food|hospital|ev"}  … 近くの施設をさがす
{"action":"search","query":"さがすことば"}  … 場所を地図でさがす・見たい
{"action":"music","query":"曲名やアーティスト（なければ空）"}  … 音楽をかける
{"action":"music_control","op":"pause|resume|next|prev"}
{"action":"map","mode":"normal|aerial|detail"}
{"action":"nav","op":"start|end|eta|overview"}
{"action":"ar","op":"on|off"}
{"action":"zoom","op":"in|out"}
{"action":"answer","text":"短い返事（60字以内）"}  … 上のどれにも当てはまらない質問や会話
今の状態: ${JSON.stringify(ctx)}
発話: 「${t}」`;
  let j;
  try{
    const res=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(AI.model)}:generateContent`,{method:'POST',
      headers:{'Content-Type':'application/json','x-goog-api-key':AI.key},
      body:JSON.stringify({contents:[{role:'user',parts:[{text:prompt}]}],generationConfig:{temperature:0.2,responseMimeType:'application/json'}})});
    const d=await res.json(); if(!res.ok) throw new Error(d&&d.error&&d.error.message||res.status);
    const txt=(d.candidates&&d.candidates[0]&&d.candidates[0].content&&d.candidates[0].content.parts||[]).map(x=>x.text||'').join('');
    j=JSON.parse(txt.replace(/^```json|```$/g,'').trim());
  }catch(e){ return null; }   // AIが使えないときは、ふつうの検索にまかせる
  const q=String(j.query||'').trim(), H=(c,x)=>handleCommand(c,true).then(r=>x?{...r,msg:x+r.msg}:r);
  switch(j.action){
    case 'go': return q?H(`${q}に行きたい`):null;
    case 'nearby': { const c=CHIPS.find(x=>x[0]===j.category); return c?H(`近くの${c[1].replace(/^\S+\s/,'')}`):null; }
    case 'search': return q?H(q):null;
    case 'music': return H(q?`${q}をかけて`:'音楽をかけて');
    case 'music_control': return H({pause:'音楽を止めて',resume:'音楽をかけて',next:'次の曲',prev:'前の曲'}[j.op]||'音楽をかけて');
    case 'map': return H({normal:'通常の地図にして',aerial:'航空写真にして',detail:'詳細の地図にして'}[j.mode]||'通常の地図にして');
    case 'nav': return H({start:'ナビ開始',end:'案内を終了',eta:'到着時刻は',overview:'全体を表示'}[j.op]||'到着時刻は');
    case 'ar': return H(j.op==='off'?'地図に戻して':'ARにして');
    case 'zoom': return H(j.op==='out'?'縮小':'拡大');
    case 'answer': return j.text?{ok:1,keep:1,msg:'🤖 '+String(j.text).slice(0,120)}:null;
  }
  return null;
}
